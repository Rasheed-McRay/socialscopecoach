<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="canonical" href="https://socialscopecoach.com/" />
    <title>SocialScope - Conversation Coach</title>
    <meta name="description" content="Upload or record conversations and get instant AI-powered feedback on your social skills, confidence, and communication style.">
    <meta name="author" content="SocialScope" />

    <!-- PWA Meta Tags -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SocialScope" />
    <meta name="theme-color" content="#0f172a" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://socialscopecoach.com/" />
    <meta property="og:site_name" content="SocialScope" />
    <meta property="og:title" content="SocialScope - Conversation Coach" />
    <meta property="og:description" content="Upload or record conversations and get instant AI-powered feedback on your social skills, confidence, and communication style." />
    <meta property="og:image" content="https://socialscopecoach.com/pwa-512x512.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@SocialScope" />
    <meta name="twitter:title" content="SocialScope - Conversation Coach" />
    <meta name="twitter:description" content="Upload or record conversations and get instant AI-powered feedback on your social skills, confidence, and communication style." />
    <meta name="twitter:image" content="https://socialscopecoach.com/pwa-512x512.png" />
  </head>


  <body>
    <!-- PWA Splash Screen -->
    <div id="splash-screen">
      <div class="splash-content">
        <img src="/favicon.png" alt="SocialScope" class="splash-logo" />
        <span class="splash-name">SocialScope</span>
      </div>
    </div>
    <style>
      #splash-screen {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #0f172a;
        z-index: 9999;
        justify-content: center;
        align-items: center;
        transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1), transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      }
      @media (display-mode: standalone) {
        #splash-screen {
          display: flex;
        }
      }
      .splash-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
      }
      .splash-logo {
        width: 240px;
        height: 240px;
        animation: pulse 2s ease-in-out infinite;
      }
      .splash-name {
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 24px;
        font-weight: 600;
        color: #f97316;
        letter-spacing: 0.5px;
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.8; transform: scale(0.95); }
      }
      #splash-screen.fade-out {
        opacity: 0;
        transform: scale(1.02);
        pointer-events: none;
      }
    </style>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
